services:
  - type: web
    name: formatflip-pro
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: PUBLIC_BIND
        value: "1"
      - key: FORMATFLIP_STATS_DB
        value: /tmp/formatflip-stats.sqlite3
